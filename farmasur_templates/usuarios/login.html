{% extends 'base/base.html' %}
{% block title %}Ingresar - Farmasur{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5 col-lg-4">
        <div class="tarjeta">
            <h1 class="h4 text-center mb-1" style="color:var(--rojo)">+ farmasur</h1>
            <p class="text-center text-muted">Iniciar sesión</p>
            {% if form.errors %}<div class="alert alert-danger py-2">Usuario o contraseña incorrectos.</div>{% endif %}
            <form method="post">
                {% csrf_token %}
                <div class="mb-3"><label class="form-label" for="id_username">Correo Gmail / email</label>
                    <input class="form-control" type="email" name="username" id="id_username" autocomplete="username" autofocus required></div>
                <div class="mb-3"><label class="form-label" for="id_password">Contraseña</label>
                    <input class="form-control" type="password" name="password" id="id_password" autocomplete="current-password" required></div>
                <button class="btn btn-rojo w-100" type="submit">Entrar</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
