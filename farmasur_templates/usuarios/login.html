{% extends 'base/base.html' %}
{% block title %}Ingresar - FARMASUR{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5 col-lg-4">
        <div class="tarjeta p-4">
            <h2 class="h4 text-center mb-3">Iniciar sesi&oacute;n</h2>
            {% if form.errors %}
            <div class="alert alert-danger py-2">Usuario o contrase&ntilde;a incorrectos.</div>
            {% endif %}
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label" for="id_username">Usuario</label>
                    <input class="form-control" type="text" name="username" id="id_username" autofocus required>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="id_password">Contrase&ntilde;a</label>
                    <input class="form-control" type="password" name="password" id="id_password" required>
                </div>
                <button class="btn btn-celeste w-100" type="submit">Entrar</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
