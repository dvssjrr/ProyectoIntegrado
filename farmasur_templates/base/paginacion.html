{% if pagina.paginator.num_pages > 1 %}
<nav class="mt-3 d-flex justify-content-between align-items-center">
    <small class="text-muted">Página {{ pagina.number }} de {{ pagina.paginator.num_pages }}</small>
    <ul class="pagination pagination-sm mb-0">
        {% if pagina.has_previous %}<li class="page-item"><a class="page-link" href="?page={{ pagina.previous_page_number }}&q={{ q|urlencode }}&estado={{ estado|urlencode }}">&laquo;</a></li>{% endif %}
        <li class="page-item active"><span class="page-link">{{ pagina.number }}</span></li>
        {% if pagina.has_next %}<li class="page-item"><a class="page-link" href="?page={{ pagina.next_page_number }}&q={{ q|urlencode }}&estado={{ estado|urlencode }}">&raquo;</a></li>{% endif %}
    </ul>
</nav>
{% endif %}
